site_name: Glassbox
site_description: Held-out causal audits for activation-level interpretability claims
repo_url: https://github.com/HassanHassnain/glassbox-audit
repo_name: HassanHassnain/glassbox-audit
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  palette:
    scheme: slate
    primary: teal
    accent: deep orange
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - Start Here:
      - Your first audit in 30 minutes: tutorials/behavior-audit-30-minutes.md
      - Methodology: METHODOLOGY.md
      - Statistical tests: STATISTICAL_TESTS.md
  - Experiments:
      - Model sweep: MODEL_SWEEP.md
      - Developmental checkpoints: DEVELOPMENTAL_AUDIT.md
      - Sycophancy audit: SYCOPHANCY_AUDIT.md
      - Head-path analysis: HEAD_PATH_ANALYSIS.md
  - Infrastructure:
      - Intervention audit cards: CERTIFY.md
      - Audit-card gallery: AUDIT_CARD_GALLERY.md
      - Mechanism drift: MECHANISM_DRIFT.md
      - Causal-handle leaderboard: LEADERBOARD.md
      - Evidence explorer: EVIDENCE_EXPLORER.md
      - 90-second demo: CERTIFY_DEMO.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search

validation:
  links:
    not_found: info

extra_css:
  - stylesheets/extra.css

copyright: Glassbox contributors
