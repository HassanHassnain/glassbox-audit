schema_version: "1.0"
name: a1_public_sae_zoo_v2_prospective_equivalence

provenance:
  supersedes_preregistration_hash: a038b5387eaea02ab7ca20311a8b52ef8ff0fcb4229ceea0795452cd9167e511
  reason: Add prospective equivalence and inferiority bounds before any SAE-zoo model outcome exists.
  prior_outcomes: No empirical SAE-zoo cell has run; only model-access and alignment failures are known.

hypotheses:
  H1_public_sae_causal: Train-selected public SAE latents produce a nonzero held-out harmful-score reduction under ablation.
  H2_public_sae_superiority: Public SAE latents outperform mean-difference and logistic-probe baselines.
  H3_same_dictionary_controls: Public SAE effects exceed random latent sets from the same dictionary.
  H4_public_sae_equivalence: SAE-minus-baseline harmful-score effects are tested for equivalence within the frozen symmetric margin.
  H5_public_sae_inferiority: SAE is tested for being worse than each simple baseline by at least the frozen inferiority margin.

success_criteria:
  H1_public_sae_causal:
    harmful_delta_lt: -0.05
    harmful_ci_high_lt: 0.0
  H2_public_sae_superiority:
    require_utility_beats_mean_and_probe: true
    require_direct_paired_harmful_superiority: true
  H3_same_dictionary_controls:
    random_control_p_lte: 0.05
  H4_public_sae_equivalence:
    equivalence_margin: 0.02
    alpha: 0.05
    require_both_one_sided_tests: true
  H5_public_sae_inferiority:
    inferiority_margin: 0.02
    alpha: 0.05
    require_pair_bootstrap_lower_bound_above_margin: true

thresholds:
  bootstrap_confidence: 0.95
  bootstrap_samples: 2500
  min_held_out_records: 250
  random_controls: 24
  selected_latents: 5
  equivalence_margin: 0.02
  inferiority_margin: 0.02
  power_effect_size: 0.05
  power_assumed_pair_sd: 0.4
  power_target: 0.8
  power_target_n_pairs: 500

metrics:
  - held_out_harmful_score_delta
  - held_out_benign_score_delta
  - capability_nll_delta
  - same_dictionary_random_control_p
  - sae_minus_mean_gap
  - sae_minus_probe_gap
  - tost_equivalence
  - one_sided_inferiority
  - paired_power

baselines:
  - mean_difference_direction
  - logistic_probe_direction
  - random_directions
  - same_dictionary_random_latents

run_order:
  - gemma_scope_9b_it_layer31_131k
  - llama_scope_31_8b_base_layer31_131k

stopping_rules:
  - stop_on_gpu_conflict
  - stop_after_two_oom_failures_at_same_scale
  - do_not_change_layers_latent_budget_bounds_or_success_criteria_after_held_out_results
  - publish_access_alignment_and_runtime_failures

reporting_rules:
  - select_latents_from_train_activations_only
  - report_instruct_and_base_model_cells_separately
  - do_not_treat_base_model_representation_results_as_instruct_refusal_results
  - publish_every_predeclared_cell
  - label_equivalence_prospective_only_when_this_hash_predates_the_cell_outcome
