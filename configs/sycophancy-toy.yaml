seed: 17
mode: standard
behavior: sycophancy
evidence_class: synthetic_fixture
dataset_path: data/sycophancy_controlled_v1.jsonl
target_layer: null

model:
  backend: toy
  name: glassbox-toy-sycophancy
  layers: [0, 1, 2, 3]
  dtype: float32
  device: cpu

sae:
  source: trained
  expansion_factor: 2
  top_k: 4
  epochs: 15
  batch_size: 64
  learning_rate: 0.003
  l1_coefficient: 0.0001
  n_features_to_intervene: 2
  device: cpu
  tokens_per_prompt: 4
  samples_per_feature: 4.0
  activation_subsample_seed: 17

evaluation:
  threshold: null
  bootstrap_samples: 30
  confidence: 0.95
  steering_scales: [-3.0, 1.0]
  random_controls: 2
  control_scale: -2.0
  layerwise_controls: true
